<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run with the Sun</title>
    <link rel="stylesheet" href="css/style.css" />

  <!-- Hier kommt Lottie-Animation-->
  </head>

  <body>
    <header>
      <h1>Run with the Sun</h1>
    </header>

    <main>
      <p class="intro">Klicke auf eine Stadt und entdecke ihren Sonnenaufgang und Sonnenuntergang.</p>
        <section class="city-buttons">
          <button>New York</button>
          <button>Tokio</button>
          <button>Kapstadt</button>
          <button>Zürich</button>
          <button>Reykjavík</button>
          <button>Dubai</button>
        </section>

<!-- Städte Card-->

  <section class="city-card day-card">
      <h2 id="city-name">New York</h2>
      <p id="current-time">Aktuell ist es in New York 23:00 Uhr</p>

        <div class="sun-data">
        <div class="data-row">
          <img src="Bilder/Sonnenaufgang_dunkel.png" alt="Sonnenaufgang-hell">
          <span> Sunrise</span>
          <span id="sunrise-time"> 7:00 AM</span>
        </div>
        
      <div class="data-row">
        <img src="Bilder/Sonne_dunkel.png" alt="Sonne">
        <span> Solar Noon</span>
        <span id="solar-noon-time"> 12:00 AM </span>
      </div>

      <div class="data-row">
        <img src="Bilder/Sonnenuntergang_dunkel.png" alt="Sonnenuntergang-dunkel">
        <span> Sunset</span>
        <span id="sunset-time"> 7:00 PM </spang>
      </div>

<!-- Info Button auf City Card-->
    <button class="info-button"> weitere Infos</button>
    </section>


<!-- Zweiter Teil mit Sonnenstrahl-->

<section class="sun-position-text">

  <h2>Der aktuelle Sonnenstand in New York</h2>

  <div class="sun-curve">

    <div class="moving-sun" id="moving-sun">
      <img src="Bilder/Mond_dunkel.png" alt="Mond">
    </div>

  </div>

</section>

    </main>



    <footer>
      <p>This is the footer of the page.</p>
    </footer>
    <script src="js/script.js" type="module"></script>
  </body>
</html>
