<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run with the Sun</title>
    <link rel="stylesheet" href="css/style.css" />

  <!-- Hier kommt Lottie-Animation-->
  </head>

  <body>
    <header>
      <h1>Run with the Sun</h1>
    </header>

    <main>
      <p class="intro">Klicke auf eine Stadt und entdecke ihren Sonnenaufgang und Sonnenuntergang</p>
        <section class="city-buttons">
          <button data-city="new-york">New York</button>
          <button data-city="tokio">Tokio</button>
          <button data-city="kapstadt">Kapstadt</button>
          <button data-city="zuerich">Zürich</button>
          <button data-city="reykjavik">Reykjavík</button>
          <button data-city="dubai">Dubai</button>
        </section>

<!-- New York-->

     <section class="card-city">
      <h2 id="city-name">New York</h2>
      <p id="current-time">Aktuell ist es in New York 23:00 Uhr</p>

        <div class="sun-daten">
        <div class="sun-daten-einzeln">
          <img src="Hier kommt ein Bild" alt="Sonnenaufgang-hell">
          <span> Sunrise</span>
          <strong id="sunrise-time"> 7:00 AM</strong>
        </div>
        
      <div class="sun-daten-einzeln">
        <img src="Hier kommt ein Bild" alt="Sonne">
        <span> Solar Noon</span>
        <strong id="solar-noon-time"> 12:00 AM </strong>
      </div>

      <div class="sun-daten-einzeln">
        <img src="Hier kommt ein Bild" alt="Sonnenuntergang-dunkel">
        <span> Sunset</span>
        <strong id="sunset-time"> 7:00 PM </strong>




    </main>
    <footer>
      <p>This is the footer of the page.</p>
    </footer>
    <script src="js/script.js" type="module"></script>
  </body>
</html>
